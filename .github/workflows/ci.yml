name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Automation safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test dependency controller
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    steps:
      - uses: actions/checkout@v7
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (Pages subpath, without secrets)
        run: npm run build
        env:
          BASE_PATH: /evolta-casa/
          SITE_URL: https://setola.github.io/evolta-casa
