name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:26.13.0-bookworm-slim@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Repository secrets take precedence; Variables remain a supported fallback.
          # These browser keys are bundled publicly: restrict APIs and HTTP referrers.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_PLACES_API_KEY || vars.VITE_GOOGLE_MAPS_PLACES_API_KEY }}
          VITE_GOOGLE_MAPS_JS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_JS_API_KEY || vars.VITE_GOOGLE_MAPS_JS_API_KEY }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
