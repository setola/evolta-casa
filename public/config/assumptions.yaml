market:
  country: IT
  currency: EUR
  locale: it-IT
  assumptionsVersion: "2025.09-mvp"
providers:
  geocoding: nominatim
  mapTiles: user-device
map:
  defaultZoom: 19
  manualPositioningAllowed: true
solar:
  # Profilo sintetico mensile di produzione per kWp installato.
  # Unità: kWh/kWp/mese. Ambito: Italia media. Fonte attesa: PVGIS o dataset equivalente.
  # Ultimo aggiornamento: 2025-09-12. Revisione: annuale. Impatta produzione, ROI e confidenza.
  monthlyKwhPerKwp: [55, 70, 105, 125, 145, 155, 165, 150, 120, 90, 60, 45]
  performanceRatio: 0.82
  azimuthLossPer90Deg: 0.18
  pitchOptimalDeg: 30
  pitchLossPer30Deg: 0.08
roof:
  defaultPitchDeg:
    flat: 5
    low: 15
    normal: 30
    steep: 45
  panelMarginM: 0.35
  panelSpacingM: 0.08
pv:
  panel:
    # Potenza nominale del pannello tecnico generico usato nell'MVP.
    # Unità: watt-peak. Non identifica un prodotto commerciale. Rivedere annualmente insieme a dimensioni ed efficienza.
    powerWp: 450
    widthM: 1.13
    heightM: 1.76
    efficiency: 0.21
  installationCost:
    # Quota indipendente dai kWp: pratiche, mobilitazione e costi minimi.
    # Unità: EUR. Fonte attesa: mediana preventivi residenziali italiani. Revisione annuale.
    fixedEur: 1500
    # Quota variabile moltiplicata per kWp installati. Unità: EUR/kWp. Impatta investimento e ROI.
    variableEurPerKwp: 1350
