seoPages:
  - slug: /fotovoltaico-con-auto-elettrica
    locale: it
    enabled: true
    seoTitle: "Fotovoltaico con auto elettrica: simulatore per casa"
    metaDescription: "Stima quanta energia serve per ricaricare un'auto elettrica a casa e quale impianto fotovoltaico può convenire."
    h1: "Fotovoltaico e auto elettrica"
    intro: "Parti da uno scenario con EV già attiva e personalizza casa, consumi e tetto."
    preset:
      mobility.evEnabled: true
    contentSlots:
      home.afterHero: "Scenario preimpostato per chi sta valutando un'auto elettrica."
      results.beforeScenarios: "Confronta bolletta, autoconsumo e ritorno economico includendo la ricarica domestica."
    faq:
      - question: "Serve sempre una batteria con l'auto elettrica?"
        answer: "No. Dipende da orari di ricarica, produzione solare e tariffe."
  - slug: /dimensionamento-accumulo-fotovoltaico
    locale: it
    enabled: true
    seoTitle: "Dimensionamento accumulo fotovoltaico domestico"
    metaDescription: "Calcola orientativamente quanto può servire una batteria per aumentare autoconsumo e autosufficienza."
    h1: "Dimensionare l'accumulo fotovoltaico"
    intro: "Simula taglie diverse di batteria senza dati inviati a un server proprietario."
featureFlags:
  telemetry: false
  csvImport: true
legal:
